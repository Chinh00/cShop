name: 🚀 Build cshop client app

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  main:
    name: 📦 Build and Push Services
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Context
        uses: actions/checkout@v4

      - name: 🛠️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env
        run: |
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" > src/Services/Web/cshopclient/.env.production
          echo "NEXT_GOOGLE_CLIENTID=${{ secrets.NEXT_GOOGLE_CLIENTID }}" >> src/Services/Web/cshopclient/.env.production
          echo "NEXT_GOOGLE_SECRET=${{ secrets.NEXT_GOOGLE_SECRET }}" >> src/Services/Web/cshopclient/.env.production
          echo "NEXT_PUBLIC_APIURL=${{ secrets.NEXT_PUBLIC_APIURL }}" >> src/Services/Web/cshopclient/.env.production
      - name: 🏗️ Build and push Docker image daotao client service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/Web/cshopclient/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_CSHOP_CLIENT_WEBAPP}}:latest
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXT_GOOGLE_CLIENTID=${{ secrets.NEXT_GOOGLE_CLIENTID }}
            NEXT_GOOGLE_SECRET=${{ secrets.NEXT_GOOGLE_SECRET }}
            NEXT_PUBLIC_APIURL=${{ secrets.NEXT_PUBLIC_APIURL }}

      